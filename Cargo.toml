[workspace]
members = [".", "packager"]
resolver = "2"

[package]
name = "wood-joinery"
version = "0.14.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Woodworking joints for SolidCraft, as a sandboxed plugin"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The French package: the plugin's messages in French (plugin/messages/fr.json).
fr = []

# Only the plugin itself (src/guest.rs, built for wasm32) reads and writes JSON.
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
