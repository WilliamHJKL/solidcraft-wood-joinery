[workspace]
members = [".", "packager"]
resolver = "2"

[package]
name = "wood-joinery"
version = "0.9.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Woodworking joints for SolidCraft, as a sandboxed plugin"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
